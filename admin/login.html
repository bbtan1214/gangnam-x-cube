<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | GANGNAM X CUBE</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .login-wrapper { height: 100vh; display: flex; align-items: center; justify-content: center; background: #fafafa; }
        .login-box { background: #fff; padding: 50px; border-radius: 12px; border: 1px solid #eee; width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        .login-box h2 { text-align: center; margin-bottom: 40px; font-weight: 800; letter-spacing: -0.02em; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.75rem; font-weight: 700; color: #999; margin-bottom: 8px; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; outline: none; }
        .login-btn { width: 100%; padding: 15px; background: #000; color: #fff; border: none; border-radius: 4px; font-weight: 700; cursor: pointer; margin-top: 20px; }
        #login-error { color: #ff4444; font-size: 0.8rem; text-align: center; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h2>GANGNAM X CUBE<br><span style="font-size: 0.8rem; opacity: 0.5;">MANAGEMENT SYSTEM</span></h2>
            <form id="admin-login-form">
                <div class="input-group">
                    <label>Admin ID</label>
                    <input type="text" id="admin-id" placeholder="ID" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="admin-pw" placeholder="Password" required>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
                <p id="login-error">아이디 또는 비밀번호가 일치하지 않습니다.</p>
            </form>
        </div>
    </div>

    <script type="module" src="../main.js?v=40"></script>
</body>
</html>
