    <style>
        .notice-wrapper { max-width: 1000px; margin: 150px auto 100px; padding: 0 40px; }
        .notice-page-title { 
            font-family: 'Fraunces', serif; 
            font-size: 3.5rem; 
            text-align: center; 
            margin-bottom: 20px; 
            letter-spacing: -0.02em;
        }
        .notice-page-subtitle {
            text-align: center;
            color: #999;
            font-size: 0.85rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 100px;
        }

        .notice-list-container { border-top: 1px solid #000; }
        
        /* Notice Item Design */
        .notice-entry { border-bottom: 1px solid #eee; transition: background 0.3s; }
        .notice-entry:hover { background: #fafafa; }
        
        .notice-header-bar { 
            padding: 40px 0; 
            cursor: pointer; 
            display: grid; 
            grid-template-columns: 120px 1fr 40px; 
            align-items: center;
            gap: 20px;
        }
        
        .notice-date { font-size: 0.9rem; color: #bbb; font-weight: 400; font-family: 'Fraunces', serif; }
        .notice-title-box { display: flex; align-items: center; gap: 15px; }
        .notice-title { font-size: 1.2rem; font-weight: 500; color: #111; letter-spacing: -0.01em; }
        
        .urgent-tag { 
            background: #000; color: #fff; padding: 4px 12px; 
            font-size: 0.65rem; font-weight: 700; letter-spacing: 0.05em; 
            border-radius: 0;
        }

        /* Accordion Content */
        .notice-body { 
            max-height: 0; 
            overflow: hidden; 
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            background: #fff;
        }
        .notice-entry.active .notice-body { 
            max-height: 1200px; 
            padding: 40px 0 60px 140px; 
        }
        .notice-content-inner {
            max-width: 700px;
            line-height: 2;
            color: #555;
            font-size: 1.05rem;
            word-break: keep-all;
        }

        .notice-chevron { 
            width: 8px; height: 8px; 
            border-right: 1px solid #000; border-bottom: 1px solid #000; 
            transform: rotate(45deg); transition: transform 0.4s; 
            margin-left: auto;
        }
        .notice-entry.active .notice-chevron { transform: rotate(-135deg); }

        @media (max-width: 768px) {
            .notice-header-bar { grid-template-columns: 1fr 40px; }
            .notice-date { grid-column: 1 / 3; margin-bottom: -10px; }
            .notice-entry.active .notice-body { padding: 20px; }
            .notice-page-title { font-size: 2.5rem; }
        }
    </style>
</head>
